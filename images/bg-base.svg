<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#fff9f1"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8d4d2"/>
      <stop offset="1" stop-color="#93c9c8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c8c7"/>
      <stop offset="1" stop-color="#efb6b9"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d6bd"/>
      <stop offset="1" stop-color="#f2c4a7"/>
    </linearGradient>
  </defs>

  <!-- full-page cream paper -->
  <rect width="1536" height="1024" fill="url(#cream)" filter="url(#paper)"/>

  <!-- top-left sage organic shape -->
  <path d="M0 0H522C477 48 430 82 366 99C292 118 209 94 130 132C73 159 40 190 0 202Z" fill="url(#sage)"/>

